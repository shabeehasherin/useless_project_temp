<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battery Percentage Analyzer</title>
    <meta name="description" content="Reads your battery % and provides deep existential over-analysis diagnosis.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Background Canvas for Interactive Quantum Particles -->
    <canvas id="particle-canvas"></canvas>

    <div class="app-wrapper" style="max-width: 720px;">
        <!-- Top Navbar -->
        <header class="header">
            <div class="brand">
                <div class="brand-icon">
                    <i data-lucide="zap"></i>
                </div>
                <div>
                    <h1 class="brand-title">Battery Percentage Analyzer</h1>
                </div>
                <span class="brand-tag">OVER-ANALYSIS</span>
            </div>
            
            <div class="header-controls">
                <div class="theme-selector-wrapper">
                    <i data-lucide="palette" style="width:14px; vertical-align:middle; margin-right:4px; color:var(--theme-color);"></i>
                    <select id="theme-select" class="theme-select-dropdown" title="Change Visual Theme Style">
                        <option value="white" selected>⚪ Clean Pearl White</option>
                        <option value="cyberpunk">🌌 Cyberpunk Quantum</option>
                        <option value="vaporwave">🍓 Pastel Vaporwave</option>
                        <option value="nordic">🌿 Nordic Forest Mint</option>
                        <option value="synthwave">⚡ Synthwave Hotline</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Main Content Layout -->
        <main class="simplified-layout" style="display: flex; flex-direction: column; gap: 24px;">
            <!-- Adjust Charge Level Bar Card -->
            <section class="glass-card controls-card" style="padding: 24px; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: var(--radius-card); backdrop-filter: blur(16px);">
                <div class="control-group">
                    <div class="control-label" style="font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
                        <span style="display: flex; align-items: center; gap: 8px;">
                            <i data-lucide="sliders" style="width:20px; color: var(--theme-color);"></i> Adjust Charge Level
                        </span>
                        <span id="slider-val-label" style="font-family: var(--font-mono); font-size: 1.3rem; font-weight: 800; color: var(--theme-color);">47%</span>
                    </div>
                    <input type="range" id="battery-slider" class="battery-slider" min="0" max="100" value="47">
                </div>
            </section>

            <!-- Deep Unnecessary Insight Diagnosis Card -->
            <section class="glass-card headline-card">
                <div class="headline-header">
                    <i data-lucide="brain-circuit"></i> Deep Unnecessary Insight Diagnosis
                </div>
                <p class="headline-text" id="headline-insight">
                    "At current rate, your phone will die emotionally before physically."
                </p>
            </section>

            <!-- Physical & Emotional Lifespan Stats -->
            <section class="stats-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="stat-card" style="padding: 20px;">
                    <span class="stat-title" style="font-size: 0.9rem;"><i data-lucide="heart-crack" style="width:18px; margin-right:6px;"></i> Emotional Lifespan</span>
                    <span class="stat-value" id="val-emotional-life" style="font-size: 1.6rem; margin-top: 8px; display: block;">14 minutes</span>
                </div>
                <div class="stat-card" style="padding: 20px;">
                    <span class="stat-title" style="font-size: 0.9rem;"><i data-lucide="clock" style="width:18px; margin-right:6px;"></i> Physical Lifespan</span>
                    <span class="stat-value" id="val-physical-life" style="font-size: 1.6rem; margin-top: 8px; display: block;">3h 17m</span>
                </div>
            </section>
        </main>
    </div>

    <!-- Application Script (ES Module) -->
    <script type="module" src="app.js"></script>
</body>
</html>
